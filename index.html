<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ff0000" />
  <title>Watch Later Adder</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: #0f0f0f;
      color: #fff;
      font-family: 'Noto Sans JP', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px 40px;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo {
      width: 44px; height: 30px;
      background: #ff0000;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo::after {
      content: '';
      border-left: 14px solid white;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
    }

    .app-title { font-size: 20px; font-weight: 700; }
    .app-sub { font-size: 12px; color: #888; margin-top: 3px; }

    .card {
      width: 100%;
      max-width: 400px;
      background: #1a1a1a;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 13px;
      color: #888;
      margin-bottom: 12px;
      font-weight: 400;
    }

    /* ステータス表示エリア */
    #statusArea {
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
    }

    .status-icon { font-size: 36px; }
    .status-text { font-size: 14px; line-height: 1.6; color: #aaa; }
    .status-text.success { color: #4caf50; }
    .status-text.error { color: #f44336; }
    .status-text.loading { color: #ffcc00; }

    /* URLプレビュー */
    #urlPreview {
      font-size: 11px;
      color: #555;
      word-break: break-all;
      line-height: 1.5;
      margin-top: 8px;
      display: none;
    }

    /* ボタン */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Noto Sans JP', sans-serif;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
      text-decoration: none;
    }
    .btn:last-child { margin-bottom: 0; }
    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary { background: #ff0000; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #cc0000; }

    .btn-secondary { background: #252525; color: #aaa; }
    .btn-secondary:hover:not(:disabled) { background: #2f2f2f; color: #fff; }

    .btn-google {
      background: #fff;
      color: #333;
      font-weight: 700;
    }

    /* ログイン前 */
    #loginSection { display: none; }

    /* 動画リスト */
    #videoListSection { display: none; }

    .video-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #222;
      cursor: pointer;
    }
    .video-item:last-child { border-bottom: none; }

    .video-item input[type="checkbox"] {
      width: 20px; height: 20px;
      accent-color: #ff0000;
      flex-shrink: 0;
      margin-top: 2px;
      cursor: pointer;
    }

    .video-thumb {
      width: 80px; height: 45px;
      background: #252525;
      border-radius: 4px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .video-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .video-info { flex: 1; min-width: 0; }
    .video-title {
      font-size: 12px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .video-id { font-size: 10px; color: #555; margin-top: 3px; }

    .select-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .select-count { font-size: 12px; color: #aaa; }
    .text-btns { display: flex; gap: 8px; }
    .text-btn {
      background: none; border: none; color: #666;
      font-size: 11px; cursor: pointer;
      font-family: 'Noto Sans JP', sans-serif;
      padding: 2px 6px; border-radius: 4px;
    }
    .text-btn:hover { color: #fff; background: #333; }

    /* 結果メッセージ */
    #resultMsg {
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      margin-bottom: 10px;
      display: none;
    }
    #resultMsg.success { background: #0a1f0a; color: #4caf50; display: block; }
    #resultMsg.error { background: #1f0a0a; color: #f44336; display: block; }

    /* プレイリストリンク */
    .playlist-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: #1a1a1a;
      border-radius: 10px;
      color: #aaa;
      text-decoration: none;
      font-size: 13px;
      margin-top: 10px;
      transition: background 0.15s, color 0.15s;
    }
    .playlist-link:hover { background: #252525; color: #fff; }

    /* ヒント */
    .tip {
      font-size: 11px;
      color: #444;
      text-align: center;
      line-height: 1.8;
      margin-top: 8px;
    }
    .tip strong { color: #666; }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <div class="logo"></div>
    <div>
      <div class="app-title">Watch Later Adder</div>
      <div class="app-sub">YouTube動画を後で見るに追加</div>
    </div>
  </div>

  <!-- ログインセクション -->
  <div class="card" id="loginSection">
    <div class="card-title">🔑 まずGoogleアカウントでログインしてね</div>
    <button class="btn btn-google" id="loginBtn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.6 2.4 30.2 0 24 0 14.7 0 6.7 5.5 2.7 13.5l7.8 6C12.4 13.3 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17z"/><path fill="#FBBC05" d="M10.5 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.1.7-4.6l-7.8-6A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.7 10.7l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.3 0-11.6-3.8-13.5-9.3l-7.8 6C6.7 42.5 14.7 48 24 48z"/></svg>
      Googleアカウントでログイン
    </button>
  </div>

  <!-- メインカード -->
  <div class="card" id="mainSection" style="display:none">
    <div class="card-title" id="mainCardTitle">📺 共有されたページを解析中...</div>
    <div id="statusArea">
      <div class="status-icon">⏳</div>
      <div class="status-text loading" id="statusText">準備中...</div>
    </div>
    <div id="urlPreview"></div>
  </div>

  <!-- 動画選択リスト -->
  <div class="card" id="videoListSection">
    <div class="select-bar">
      <span class="select-count"><strong id="checkedCount">0</strong> 本選択中</span>
      <div class="text-btns">
        <button class="text-btn" id="selectAllBtn">全選択</button>
        <button class="text-btn" id="deselectAllBtn">全解除</button>
      </div>
    </div>
    <div id="videoList"></div>
    <div id="resultMsg"></div>
    <button class="btn btn-primary" id="addBtn" style="margin-top:14px" disabled>
      追加する
    </button>
  </div>

  <!-- アクションボタン -->
  <div style="width:100%; max-width:400px" id="actionSection" style="display:none">
    <a class="playlist-link" id="playlistLink" href="#" target="_blank">
      <span>▶️</span>
      「後で見る」リストをYouTubeで開く
      <span style="margin-left:auto; color:#444">→</span>
    </a>
  </div>

  <p class="tip" style="margin-top:20px">
    ブラウザの<strong>「共有」→「Watch Later Adder」</strong>から<br>
    どのページでも使えるよ！
  </p>

  <script src="app.js"></script>
</body>
</html>
